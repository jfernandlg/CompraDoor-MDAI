<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Listado de Servicios</h1>
        <div>
            <a th:href="@{/servicios/menu}" class="btn btn-outline-secondary me-2">Menú Servicios</a>
            <a th:href="@{/servicios/new}" class="btn btn-success">Nuevo Servicio</a>
        </div>
    </div>

    <div th:if="${servicios == null or #lists.isEmpty(servicios)}" class="alert alert-info">No hay Servicios</div>

    <table class="table table-striped" th:unless="${servicios == null or #lists.isEmpty(servicios)}">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Descripción</th>
            <th>Coste</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${servicios}">
            <td th:text="${s.idServicio}"></td>
            <td th:text="${s.tipoServicio}"></td>
            <td th:text="${s.descripcion}"></td>
            <td th:text="${s.coste}"></td>
            <td th:text="${s.fechaAplicacion}"></td>
            <td>
                <form th:action="@{/servicios/{id}/delete(id=${s.idServicio})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
