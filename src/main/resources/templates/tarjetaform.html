<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${tarjeta.id == null ? 'Crear Tarjeta' : 'Editar Tarjeta'}">Tarjeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${tarjeta.id == null ? 'Crear Tarjeta' : 'Editar Tarjeta'}">Tarjeta</h1>
        <a th:href="@{/tarjetas/all}" class="btn btn-secondary">Volver a la lista</a>
    </div>

    <form th:action="@{/tarjetas/}" th:object="${tarjeta}" method="post">
        <div class="mb-3">
            <label for="codigo" class="form-label">Código</label>
            <input id="codigo" class="form-control" th:field="*{codigoTarjeta}" />
        </div>

        <div class="mb-3 form-check">
            <input id="valida" type="checkbox" class="form-check-input" th:field="*{valida}" />
            <label for="valida" class="form-check-label">Válida</label>
        </div>

        <div class="mb-3">
            <label for="cliente" class="form-label">Cliente</label>
            <select id="cliente" class="form-select" th:field="*{cliente.id}">
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/tarjetas/all}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
