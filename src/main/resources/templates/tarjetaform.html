<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestión de Tarjeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-secondary text-white">
                    <h4 class="mb-0" th:text="${tarjeta.id == null ? 'Nueva Tarjeta' : 'Editar Tarjeta'}">Tarjeta</h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/tarjetas/}" th:object="${tarjeta}" method="post">

                        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                        <div class="mb-3">
                            <label for="codigo" class="form-label">Código de Tarjeta</label>
                            <input id="codigo" class="form-control" th:field="*{codigoTarjeta}"
                                   th:classappend="${#fields.hasErrors('codigoTarjeta')} ? 'is-invalid' : ''"
                                   placeholder="XXXX-XXXX-XXXX-XXXX"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('codigoTarjeta')}" th:errors="*{codigoTarjeta}">Error</div>
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input id="valida" type="checkbox" class="form-check-input" th:field="*{valida}" />
                            <label for="valida" class="form-check-label">Tarjeta Activa / Válida</label>
                        </div>

                        <div class="mb-3">
                            <label for="cliente" class="form-label">Titular (Cliente)</label>
                            <select id="cliente" class="form-select" th:field="*{cliente}"
                                    th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid' : ''">
                                <option value="">-- Selecciona un cliente --</option>
                                <option th:each="c : ${clientes}"
                                        th:value="${c.id}"
                                        th:text="${c.nombre + ' (' + c.dni + ')'}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}">Error</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/tarjetas/all}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Tarjeta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
