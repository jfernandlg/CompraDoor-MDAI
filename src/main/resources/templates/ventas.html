<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Gestión de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4">Listado de Ventas</h1>

    <div class="card mb-4 bg-light">
        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-5">
                    <label class="form-label fw-bold">Buscar por Cliente</label>
                    <form th:action="@{/ventas/search_clientes}" method="get" class="d-flex">
                        <input type="text" name="query" class="form-control me-2" placeholder="Introduce DNI...">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                    </form>
                </div>

                <div class="col-md-5">
                    <label class="form-label fw-bold">Filtrar por Fechas</label>
                    <form th:action="@{/ventas/search}" method="get" class="d-flex gap-2">
                        <input type="date" name="fechaInicio" class="form-control" required>
                        <input type="date" name="fechaFin" class="form-control" required>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-calendar-check"></i></button>
                    </form>
                </div>

                <div class="col-md-2 d-flex flex-column justify-content-end gap-2">
                    <a th:href="@{/ventas}" class="btn btn-outline-secondary w-100" title="Ver todas">
                        <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                    </a>
                    <a th:href="@{/ventas/new}" class="btn btn-success w-100">
                        <i class="bi bi-plus-lg"></i> Nueva Venta
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${ventas.empty}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> No hay ventas registradas o no coinciden con la búsqueda.
    </div>

    <table class="table table-striped table-hover align-middle shadow-sm" th:unless="${ventas.empty}">
        <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Precio</th>
            <th>Cliente</th>
            <th>Inmueble (Dirección)</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="venta : ${ventas}">
            <td th:text="${#dates.format(venta.fechaVenta, 'dd/MM/yyyy')}">01/01/2024</td>

            <td th:text="${venta.precioVenta} + ' €'" class="fw-bold text-success">150000 €</td>

            <td>
                <span th:if="${venta.cliente != null}"
                      th:text="${venta.cliente.nombre + ' (' + venta.cliente.dni + ')'}">Juan</span>
                <span th:if="${venta.cliente == null}" class="text-muted">Sin Cliente</span>
            </td>

            <td>
                <span th:if="${venta.inmueble != null}"
                      th:text="${venta.inmueble.direccion + ', ' + venta.inmueble.localidad}">Calle Falsa 123</span>
                <span th:if="${venta.inmueble == null}" class="text-muted">Sin Inmueble</span>
            </td>

            <td class="text-end">
                <form th:action="@{/ventas/{id}/delete(id=${venta.idVenta})}" method="post" style="display:inline;"
                      onsubmit="return confirm('¿Estás seguro de eliminar esta venta? Esta acción no se puede deshacer.');">
                    <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
