<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${servicio.idServicio == null ? 'Crear Servicio' : 'Editar Servicio'}">Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${servicio.idServicio == null ? 'Crear Servicio' : 'Editar Servicio'}">Servicio</h1>
        <a th:href="@{/servicios/all}" class="btn btn-secondary">Volver a la lista</a>
    </div>

    <form th:action="@{/servicios/}" th:object="${servicio}" method="post">
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" class="form-select" th:field="*{tipoServicio}">
                <option th:each="t : ${T(es.unex.cum.mdai.compradoor.data.model.TipoServicio).values()}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="desc" class="form-label">Descripción</label>
            <input id="desc" class="form-control" th:field="*{descripcion}" />
        </div>

        <div class="mb-3">
            <label for="coste" class="form-label">Coste</label>
            <input id="coste" type="number" step="0.01" class="form-control" th:field="*{coste}" />
        </div>

        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha aplicación</label>
            <input id="fecha" type="date" class="form-control" th:field="*{fechaAplicacion}" />
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/servicios/all}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
