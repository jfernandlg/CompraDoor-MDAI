<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Lista de Inmuebles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Estilo para que todas las fotos tengan la misma altura y no descuadren la tarjeta */
        .card-img-top-container {
            height: 200px; /* Altura fija para la zona de la foto */
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .carousel-item img {
            height: 200px;
            object-fit: cover; /* Recorta la imagen para llenar el hueco sin deformarse */
            width: 100%;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">CompraDoor Inmobiliaria</span>
        <a th:href="@{/inmuebles/new}" class="btn btn-light btn-sm text-primary fw-bold">
            <i class="bi bi-plus-circle-fill"></i> Publicar Inmueble
        </a>
    </div>
</nav>

<div class="container">

    <div class="card mb-4 bg-light border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-funnel"></i> Filtrar por precio</h5>
            <form th:action="@{/inmuebles/search}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="min" class="form-label small text-muted">Precio Mínimo</label>
                    <div class="input-group">
                        <span class="input-group-text">€</span>
                        <input id="min" step="0.01" type="number" name="min" class="form-control" placeholder="0">
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="max" class="form-label small text-muted">Precio Máximo</label>
                    <div class="input-group">
                        <span class="input-group-text">€</span>
                        <input id="max" step="0.01" type="number" name="max" class="form-control"
                               placeholder="Sin límite">
                    </div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" type="submit">Buscar</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/inmuebles/}" class="btn btn-outline-secondary w-100">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${error != null}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${inmuebles == null or #lists.isEmpty(inmuebles)}" class="alert alert-info text-center py-5">
        <i class="bi bi-houses display-4 d-block mb-3"></i>
        No hay inmuebles disponibles en este momento.
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
         th:unless="${inmuebles == null or #lists.isEmpty(inmuebles)}">

        <div class="col" th:each="i : ${inmuebles}">
            <div class="card h-100 shadow-sm border-0">

                <div class="card-img-top-container position-relative">

                    <div th:if="${not #lists.isEmpty(i.pathFotos)}"
                         th:id="'carousel-' + ${i.idInmueble}"
                         class="carousel slide" data-bs-interval="false">
                        <div class="carousel-inner">
                            <div th:each="foto, stat : ${i.pathFotos}"
                                 class="carousel-item"
                                 th:classappend="${stat.first} ? 'active'">
                                <img th:src="@{${foto}}" class="d-block w-100" alt="Foto inmueble">
                            </div>
                        </div>

                        <button th:if="${#lists.size(i.pathFotos) > 1}" class="carousel-control-prev" type="button"
                                th:data-bs-target="'#carousel-' + ${i.idInmueble}" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Anterior</span>
                        </button>
                        <button th:if="${#lists.size(i.pathFotos) > 1}" class="carousel-control-next" type="button"
                                th:data-bs-target="'#carousel-' + ${i.idInmueble}" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Siguiente</span>
                        </button>
                    </div>

                    <div th:if="${#lists.isEmpty(i.pathFotos)}"
                         class="d-flex align-items-center justify-content-center h-100 bg-secondary text-white">
                        <div class="text-center">
                            <i class="bi bi-camera-video-off display-6"></i>
                            <p class="m-0 small">Sin fotos</p>
                        </div>
                    </div>

                    <span class="position-absolute bottom-0 end-0 bg-dark text-white px-3 py-1 m-2 rounded-pill fw-bold bg-opacity-75">
                        <span th:text="${i.precio} + ' €'"></span>
                    </span>
                </div>

                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${i.localidad}">Localidad</h5>
                    <p class="card-text text-muted small mb-2">
                        <i class="bi bi-geo-alt-fill text-danger"></i> <span th:text="${i.direccion}">Dirección</span>
                    </p>

                    <div class="d-flex justify-content-between mt-3 text-secondary small">
                        <span><i class="bi bi-house-door"></i> Inmueble</span>
                        <span>ID: <span th:text="${#strings.substring(i.idInmueble, 0, 8)}">...</span></span>
                    </div>
                </div>

                <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
                    <a th:href="@{/inmuebles/edit/{id}(id=${i.idInmueble})}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-pencil-square"></i> Editar
                    </a>

                    <form th:action="@{/inmuebles/{id}/delete(id=${i.idInmueble})}" method="post"
                          onsubmit="return confirm('¿Seguro que quieres eliminar este inmueble?');">
                        <button type="submit" class="btn btn-outline-danger btn-sm border-0">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
