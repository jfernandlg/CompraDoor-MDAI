<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Inmuebles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Listado de Inmuebles</h1>
        <div>
            <a th:href="@{/inmuebles/new}" class="btn btn-success">Nuevo Inmueble</a>
        </div>
    </div>

    <div th:if="${error != null}" class="alert alert-warning" th:text="${error}"></div>
    <div th:if="${inmuebles == null or #lists.isEmpty(inmuebles)}" class="alert alert-info">No hay Inmuebles</div>

    <table class="table table-striped" th:unless="${inmuebles == null or #lists.isEmpty(inmuebles)}">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Dirección</th>
            <th>Localidad</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${inmuebles}">
            <td th:text="${i.idInmueble}"></td>
            <td th:text="${i.direccion}"></td>
            <td th:text="${i.localidad}"></td>
            <td th:text="${i.precio}"></td>
            <td>
                <form th:action="@{/inmuebles/{id}/delete(id=${i.idInmueble})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
                <a th:href="@{/inmuebles/edit/{id}(id=${i.idInmueble})}" class="btn btn-primary btn-sm">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <hr />
    <h5>Búsqueda por precio</h5>
    <form th:action="@{/inmuebles/search}" method="get" class="row g-2">
        <div class="col-auto">
            <label for="min" class="visually-hidden">Precio mínimo</label>
            <input id="min" step="0.01" type="number" name="min" class="form-control" placeholder="Precio mínimo" />
        </div>
        <div class="col-auto">
            <label for="max" class="visually-hidden">Precio máximo</label>
            <input id="max" step="0.01" type="number" name="max" class="form-control" placeholder="Precio máximo" />
        </div>
        <div class="col-auto">
            <button class="btn btn-primary">Buscar</button>
        </div>
    </form>
</div>
</body>
</html>
