<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Mercado de Inmuebles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Estilo para las fotos */
        .card-img-top-container {
            height: 220px;
            overflow: hidden;
            background-color: #e9ecef;
        }
        .carousel-item img {
            height: 220px;
            object-fit: cover;
            width: 100%;
        }
        /* Efecto hover suave en la tarjeta */
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/inmuebles">
            <i class="bi bi-building-fill-check"></i> CompraDoor
        </a>

        <div class="d-flex gap-2">
            <a th:href="@{/inmuebles/new}" class="btn btn-light text-primary fw-bold btn-sm">
                <i class="bi bi-tag-fill"></i> Publicar nuevo anuncio
            </a>
        </div>
    </div>
</nav>

<div class="container">

    <div class="card mb-5 border-0 shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-3 fw-bold text-primary"><i class="bi bi-search"></i> Encuentra tu hogar ideal</h5>
            <form th:action="@{/inmuebles/search}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="min" class="form-label small text-muted text-uppercase fw-bold">Precio Mínimo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">€</span>
                        <input id="min" step="0.01" type="number" name="min" class="form-control border-start-0" placeholder="0">
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="max" class="form-label small text-muted text-uppercase fw-bold">Precio Máximo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">€</span>
                        <input id="max" step="0.01" type="number" name="max" class="form-control border-start-0" placeholder="Sin límite">
                    </div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100 fw-bold" type="submit">Filtrar</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/inmuebles/}" class="btn btn-outline-secondary w-100">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${error != null}" class="alert alert-warning alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${inmuebles == null or #lists.isEmpty(inmuebles)}" class="alert alert-info text-center py-5 shadow-sm border-0">
        <div class="display-1 text-info mb-3"><i class="bi bi-house-slash"></i></div>
        <h4>No hay inmuebles disponibles</h4>
        <p class="text-muted">Prueba a cambiar los filtros o publica el primero.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${inmuebles == null or #lists.isEmpty(inmuebles)}">

        <div class="col" th:each="i : ${inmuebles}">
            <div class="card h-100 shadow-sm border-0 overflow-hidden">

                <div class="card-img-top-container position-relative">

                    <div th:if="${not #lists.isEmpty(i.pathFotos)}"
                         th:id="'carousel-' + ${i.idInmueble}"
                         class="carousel slide" data-bs-interval="false">
                        <div class="carousel-inner">
                            <div th:each="foto, stat : ${i.pathFotos}"
                                 class="carousel-item"
                                 th:classappend="${stat.first} ? 'active'">
                                <img th:src="@{${foto}}" class="d-block w-100" alt="Foto inmueble">
                            </div>
                        </div>
                        <button th:if="${#lists.size(i.pathFotos) > 1}" class="carousel-control-prev" type="button"
                                th:data-bs-target="'#carousel-' + ${i.idInmueble}" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon bg-dark rounded-circle p-2 bg-opacity-50" aria-hidden="true"></span>
                            <span class="visually-hidden">Anterior</span>
                        </button>
                        <button th:if="${#lists.size(i.pathFotos) > 1}" class="carousel-control-next" type="button"
                                th:data-bs-target="'#carousel-' + ${i.idInmueble}" data-bs-slide="next">
                            <span class="carousel-control-next-icon bg-dark rounded-circle p-2 bg-opacity-50" aria-hidden="true"></span>
                            <span class="visually-hidden">Siguiente</span>
                        </button>
                    </div>

                    <div th:if="${#lists.isEmpty(i.pathFotos)}"
                         class="d-flex align-items-center justify-content-center h-100 bg-secondary text-white">
                        <div class="text-center">
                            <i class="bi bi-camera-video-off display-4 opacity-50"></i>
                        </div>
                    </div>

                    <span class="position-absolute bottom-0 end-0 bg-success text-white px-3 py-2 m-0 rounded-start fw-bold shadow">
                        <span th:text="${i.precio} + ' €'"></span>
                    </span>
                </div>

                <div class="card-body">
                    <h5 class="card-title text-truncate fw-bold mb-1" th:text="${i.localidad}">Localidad</h5>
                    <p class="card-text text-muted mb-3 small">
                        <i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="${i.direccion}">Dirección</span>
                    </p>

                    <a th:href="@{/ventas/new(idInmueble=${i.idInmueble})}" class="btn btn-primary w-100 fw-bold shadow-sm">
                        <i class="bi bi-bag-check-fill me-1"></i> Comprar Ahora
                    </a>
                </div>

                <div class="card-footer bg-white border-top py-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted small" style="font-size: 0.75rem;">
                            ID: <span th:text="${#strings.substring(i.idInmueble, 0, 6)}"></span>
                        </span>

<!--                        <div class="btn-group btn-group-sm">-->
<!--                            <a th:href="@{/inmuebles/edit/{id}(id=${i.idInmueble})}"-->
<!--                               class="btn btn-link text-decoration-none text-muted" title="Editar datos">-->
<!--                                <i class="bi bi-pencil-square"></i>-->
<!--                            </a>-->
<!--                            <form th:action="@{/inmuebles/{id}/delete(id=${i.idInmueble})}" method="post" style="display:inline"-->
<!--                                  onsubmit="return confirm('¿Eliminar permanentemente este inmueble?');">-->
<!--                                <button type="submit" class="btn btn-link text-decoration-none text-danger" title="Eliminar">-->
<!--                                    <i class="bi bi-trash"></i>-->
<!--                                </button>-->
<!--                            </form>-->
<!--                        </div>-->
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
