<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .table-hover tbody tr:hover {
            background-color: #f1f3f5;
        }

        .avatar-initial {
            width: 40px;
            height: 40px;
            background-color: #e9ecef;
            color: #495057;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">
            <i class="bi bi-shield-lock-fill"></i> Panel Admin
        </a>
        <a th:href="@{/admin}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al Menú
        </a>
    </div>
</nav>

<div class="container pb-5">

    <div class="row align-items-center mb-4 g-3">
        <div class="col-md-6">
            <h2 class="fw-bold text-primary mb-0">👥 Clientes</h2>
            <p class="text-muted mb-0">Base de datos de usuarios registrados</p>
        </div>
        <div class="col-md-6 text-md-end">
            <a th:href="@{/clientes/new}" class="btn btn-success shadow-sm">
                <i class="bi bi-person-plus-fill"></i> Nuevo Cliente
            </a>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body bg-white py-3">
            <form th:action="@{/clientes/search}" method="get" class="row g-2 align-items-center">
                <div class="col-auto">
                    <span class="fw-bold text-muted"><i class="bi bi-funnel"></i> Filtrar:</span>
                </div>
                <div class="col">
                    <input type="text" name="query" class="form-control bg-light" placeholder="Buscar por DNI..."
                           th:value="${param.query}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary" title="Borrar filtros">
                        <i class="bi bi-x-lg"></i> Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${clientes.empty}" class="alert alert-warning d-flex align-items-center shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
        <div>
            <strong>No se han encontrado resultados.</strong>
            <br>Intenta buscar con otro DNI o <a th:href="@{/clientes}" class="alert-link">vuelve al listado
            completo</a>.
        </div>
    </div>

    <div class="card shadow-sm" th:unless="${clientes.empty}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4">Usuario</th>
                    <th>DNI</th>
                    <th>Contacto</th>
                    <th class="text-end pe-4">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td class="ps-4">
                        <div class="d-flex align-items-center">
                            <div class="avatar-initial me-3" th:text="${#strings.substring(cliente.nombre,0,1)}">A</div>
                            <div>
                                <div class="fw-bold text-dark" th:text="${cliente.nombre}">Nombre</div>
                                <small class="text-muted">ID: <span
                                        th:text="${#strings.abbreviate(cliente.id.toString(),8)}"></span></small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border font-monospace"
                              th:text="${cliente.dni}">12345678A</span>
                    </td>
                    <td>
                        <div class="d-flex flex-column">
                            <span class="text-muted"><i class="bi bi-envelope-at small"></i> <span
                                    th:text="${cliente.email}">email</span></span>
                            <span class="text-muted"><i class="bi bi-telephone small"></i> <span
                                    th:text="${cliente.telefono}">tlf</span></span>
                        </div>
                    </td>
                    <td class="text-end pe-4">
                        <div class="btn-group">
                            <a th:href="@{/clientes/edit/{id}(id=${cliente.id})}" class="btn btn-outline-primary btn-sm"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <span th:if="${cliente.admin}" class="btn btn-outline-secondary btn-sm disabled"
                                  title="Administrador protegido">
                                <i class="bi bi-shield-lock-fill"></i>
                            </span>

                            <form th:unless="${cliente.admin}" th:action="@{/clientes/{id}/delete(id=${cliente.id})}" method="post"
                                  onsubmit="return confirm('¿Borrar cliente? Se borrarán sus ventas y tarjetas asociadas.');">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-0 rounded-end" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-muted small py-3">
            Total clientes: <strong th:text="${clientes.size()}"></strong>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
