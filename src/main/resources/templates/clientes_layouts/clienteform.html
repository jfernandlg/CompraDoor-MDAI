<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-person-lines-fill me-2"></i>
                        <span th:text="${cliente.id == null} ? 'Alta de Nuevo Cliente' : 'Editar Datos del Cliente'"></span>
                    </h4>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="${cliente.id != null} ? @{'/clientes/update/' + ${cliente.id}} : @{/clientes}"
                          th:object="${cliente}"
                          method="post">

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger mb-4">
                            <i class="bi bi-exclamation-circle-fill"></i>
                            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                        </div>

                        <h6 class="text-uppercase text-muted fw-bold mb-3 small ls-1">Información Personal</h6>

                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label for="nombre" class="form-label fw-bold">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                       placeholder="Ej: Juan Pérez"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                            </div>
                            <div class="col-md-4">
                                <label for="dni" class="form-label fw-bold">DNI / NIF</label>
                                <input type="text" class="form-control font-monospace" id="dni" th:field="*{dni}"
                                       placeholder="12345678A"
                                       th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{dni}">Error</div>
                            </div>
                        </div>

                        <hr class="my-4 text-muted">

                        <h6 class="text-uppercase text-muted fw-bold mb-3 small ls-1">Datos de Contacto</h6>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" th:field="*{email}"
                                           placeholder="usuario@ejemplo.com"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:errors="*{email}">Error</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="telefono" class="form-label fw-bold">Teléfono</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                    <input type="text" class="form-control" id="telefono" th:field="*{telefono}"
                                           placeholder="600 000 000"
                                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:errors="*{telefono}">Error</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                            <a th:href="@{/clientes}" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">
                                <i class="bi bi-save me-1"></i> Guardar Cambios
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
