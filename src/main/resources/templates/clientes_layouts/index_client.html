<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compradoor - Encuentra tu Hogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar Transparente con efecto Glass */
        .navbar-glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .galaxy-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        .hero-section { text-align: center; padding: 5rem 1rem; margin-bottom: 3rem; }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #6c5ce7, #74b9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .search-card {
            background: white; border-radius: 50px; padding: 10px 10px 10px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 700px;
        }

        .btn-galaxy {
            background: linear-gradient(45deg, #6c5ce7, #74b9ff); border: none; color: white;
            border-radius: 40px; padding: 10px 30px; font-weight: bold; transition: transform 0.3s;
        }
        .btn-galaxy:hover { transform: scale(1.05); color: white; box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3); }

        .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-top: 4rem; }

        .action-card {
            background: white; border-radius: 20px; padding: 2rem; text-align: center;
            transition: all 0.3s; text-decoration: none; color: #2d3436; border: 1px solid rgba(0,0,0,0.05);
        }
        .action-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-primary" th:href="@{/}">
            <i class="bi bi-building-fill-check"></i> Compradoor
        </a>

        <div class="d-flex align-items-center gap-3">
            <div th:if="${session.clienteLogueado == null}">
                <a th:href="@{/login}" class="btn btn-outline-primary rounded-pill px-4">Iniciar Sesión</a>
                <a th:href="@{/register}" class="btn btn-primary rounded-pill px-4">Registrarse</a>
            </div>

            <div th:if="${session.clienteLogueado != null}" class="d-flex align-items-center gap-3">
                <span class="text-muted small d-none d-md-block">Hola, <b th:text="${session.clienteLogueado.nombre}">User</b></span>
                <a th:href="@{/perfil}" class="btn btn-outline-primary rounded-pill"><i class="bi bi-person-circle"></i> Mi Área</a>
                <a th:href="@{/logout}" class="btn btn-link text-danger text-decoration-none"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </div>
    </div>
</nav>

<div class="galaxy-container">

    <div class="hero-section">
        <h1 class="hero-title">Encuentra tu lugar <br> en el mundo</h1>
        <p class="lead text-muted mb-5">La plataforma inmobiliaria más moderna y segura.</p>

        <div class="search-card">
            <form th:action="@{/inmuebles/search}" method="get" class="row g-2 align-items-center">
                <div class="col-md-4 border-end">
                    <input type="number" name="min" class="form-control form-control-lg border-0 bg-transparent" placeholder="Precio Min €">
                </div>
                <div class="col-md-4 border-end">
                    <input type="number" name="max" class="form-control form-control-lg border-0 bg-transparent" placeholder="Precio Máx €">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-galaxy w-100 h-100">Buscar Casas 🚀</button>
                </div>
            </form>
        </div>
    </div>

    <div class="action-grid">
        <a th:href="@{/inmuebles/}" class="action-card">
            <i class="bi bi-houses display-4 text-primary mb-3"></i>
            <h3>Ver Catálogo</h3>
            <p class="text-muted">Explora todas las propiedades disponibles ahora mismo.</p>
        </a>

        <a th:href="${session.clienteLogueado != null && session.clienteLogueado.admin} ? @{/admin} : @{/perfil}" class="action-card">
            <i class="bi bi-person-gear display-4 text-info mb-3"></i>
            <h3>Gestión</h3>
            <p class="text-muted">Accede a tu panel personal o de administración.</p>
        </a>
    </div>

</div>

</body>
</html>
