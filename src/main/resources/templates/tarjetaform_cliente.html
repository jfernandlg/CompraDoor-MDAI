<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Nueva Tarjeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Añadir Tarjeta</h4>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/tarjetas/mis-tarjetas}" th:object="${tarjeta}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Código de Tarjeta</label>

                            <input class="form-control"
                                   id="inputTarjeta"
                                   th:field="*{codigoTarjeta}"
                                   placeholder="0000 0000 0000 0000"
                                   maxlength="19"
                                   th:classappend="${#fields.hasErrors('codigoTarjeta')} ? 'is-invalid' : ''"/>

                            <div class="invalid-feedback" th:if="${#fields.hasErrors('codigoTarjeta')}" th:errors="*{codigoTarjeta}">Error</div>
                            <div class="form-text">Solo números. Se formateará automáticamente.</div>
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input id="valida" type="checkbox" class="form-check-input" th:field="*{valida}" />
                            <label for="valida" class="form-check-label">Tarjeta Activa</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/tarjetas/mis-tarjetas}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('inputTarjeta').addEventListener('input', function (e) {
        // 1. Quitamos todo lo que no sea número
        let value = e.target.value.replace(/\D/g, '');

        // 2. Ponemos un espacio cada 4 números
        let formattedValue = value.replace(/(\d{4})(?=\d)/g, '$1 ');

        // 3. Asignamos el valor formateado al input
        e.target.value = formattedValue;
    });
</script>

</body>
</html>
