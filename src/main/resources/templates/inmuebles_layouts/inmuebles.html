<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Mercado de Inmuebles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        .card-img-top-container {
            height: 220px;
            overflow: hidden;
            background-color: #e9ecef;
        }
        .carousel-item img {
            height: 220px;
            object-fit: cover;
            width: 100%;
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-building-fill-check"></i> Compradoor
        </a>

        <div class="d-flex gap-2">

            <a th:href="${session.clienteLogueado != null} ? @{/inmuebles/new} : @{/login}"
               class="btn btn-warning fw-bold text-dark shadow-sm">
                <i class="bi bi-house-add-fill"></i> Vender mi Casa
            </a>

            <a th:if="${session.clienteLogueado == null}" th:href="@{/login}" class="btn btn-outline-light">
                Iniciar Sesión
            </a>

            <a th:if="${session.clienteLogueado != null}" th:href="@{/perfil}" class="btn btn-outline-light">
                <i class="bi bi-person-circle"></i> Mi Perfil
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <div class="card mb-4 border-0 shadow-sm">
        <div class="card-body">
            <form th:action="@{/inmuebles/search}" method="get" class="row g-2 align-items-center">
                <div class="col-auto"><span class="fw-bold text-muted">Filtrar precio:</span></div>
                <div class="col"><input type="number" name="min" class="form-control" placeholder="Min €"></div>
                <div class="col"><input type="number" name="max" class="form-control" placeholder="Max €"></div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary px-4">Buscar</button>
                    <a th:href="@{/inmuebles/}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

        <div class="col" th:each="i : ${inmuebles}">
            <div class="card h-100 border-0 shadow-sm">

                <div class="card-img-top-container position-relative">
                    <span class="badge bg-success position-absolute top-0 end-0 m-3 z-3 fs-6">En Venta</span>

                    <div th:id="'carousel-' + ${i.idInmueble}" class="carousel slide" data-bs-ride="false">
                        <div class="carousel-inner">
                            <div th:if="${#lists.isEmpty(i.pathFotos)}" class="carousel-item active">
                                <img src="https://dummyimage.com/600x400/dee2e6/6c757d.jpg&text=Sin+Imagen" class="d-block w-100">
                            </div>
                            <div th:each="foto, iterStat : ${i.pathFotos}" class="carousel-item" th:classappend="${iterStat.first} ? 'active'">
                                <img th:src="@{${foto}}" class="d-block w-100">
                            </div>
                        </div>

                        <button th:if="${not #lists.isEmpty(i.pathFotos)}" class="carousel-control-prev" type="button" th:data-bs-target="'#carousel-' + ${i.idInmueble}" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        </button>
                        <button th:if="${not #lists.isEmpty(i.pathFotos)}" class="carousel-control-next" type="button" th:data-bs-target="'#carousel-' + ${i.idInmueble}" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <div class="card-body">
                    <h5 class="card-title fw-bold text-truncate" th:text="${i.direccion}">Dirección</h5>
                    <p class="card-text text-muted mb-2"><i class="bi bi-geo-alt-fill text-danger"></i> <span th:text="${i.localidad}">Localidad</span></p>
                    <h4 class="text-primary fw-bold mb-3" th:text="${i.precio} + ' €'">0 €</h4>

                    <div class="d-grid">
                        <a th:href="${session.clienteLogueado != null} ? @{/transaccion/confirmar(idInmueble=${i.idInmueble})} : @{/login}"
                           class="btn btn-primary fw-bold">
                            Comprar Ahora
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
