<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Crear/Editar Compra</title>
</head>
<body>
<h1 th:text="${compra.idCompra != null} ? 'Editar Compra' : 'Nueva Compra'">Compra</h1>
<form th:action="${compra.idCompra != null} ? @{/compras/update/{id}(id=${compra.idCompra})} : @{/compras/}" method="post" th:object="${compra}">
    <div>
        <label>Cliente:</label>
        <select th:field="*{cliente.id}">
            <option th:each="cli : ${clientes}" th:value="${cli.id}" th:text="${cli.nombre}"></option>
        </select>
    </div>
    <div>
        <label>Inmueble:</label>
        <select th:field="*{inmueble.idInmueble}">
            <option th:each="inm : ${inmuebles}" th:value="${inm.idInmueble}" th:text="${inm.direccion}"></option>
        </select>
    </div>
    <div>
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precioCompra}"/>
    </div>
    <div>
        <button type="submit">Guardar</button>
    </div>
</form>
<p><a th:href="@{/compras/all}">Volver al listado</a></p>
</body>
</html>
