<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${inmueble.idInmueble == null ? 'Crear Inmueble' : 'Editar Inmueble'}">Inmueble</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${inmueble.idInmueble == null ? 'Crear Inmueble' : 'Editar Inmueble'}">Inmueble</h1>
        <a th:href="@{/inmuebles/}" class="btn btn-secondary">Volver a la lista</a>
    </div>

    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

    <form th:if="${inmueble.idInmueble == null}" th:action="@{/inmuebles/}" th:object="${inmueble}" method="post">
        <div class="mb-3">
            <label for="direccion" class="form-label">Dirección</label>
            <input id="direccion" class="form-control" th:field="*{direccion}" />
        </div>

        <div class="mb-3">
            <label for="localidad" class="form-label">Localidad</label>
            <input id="localidad" class="form-control" th:field="*{localidad}" />
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input id="precio" type="number" step="0.01" class="form-control" th:field="*{precio}" />
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/inmuebles/}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

    <form th:if="${inmueble.idInmueble != null}" th:action="@{'/inmuebles/update/' + ${inmueble.idInmueble}}" th:object="${inmueble}" method="post">
        <div class="mb-3">
            <label for="direccion2" class="form-label">Dirección</label>
            <input id="direccion2" class="form-control" th:field="*{direccion}" />
        </div>

        <div class="mb-3">
            <label for="localidad2" class="form-label">Localidad</label>
            <input id="localidad2" class="form-control" th:field="*{localidad}" />
        </div>

        <div class="mb-3">
            <label for="precio2" class="form-label">Precio</label>
            <input id="precio2" type="number" step="0.01" class="form-control" th:field="*{precio}" />
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/inmuebles/}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

</div>
</body>
</html>
