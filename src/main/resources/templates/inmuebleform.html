<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Publicar Inmueble</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Datos del Inmueble</h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="${inmueble.idInmueble != null} ? @{'/inmuebles/update/' + ${inmueble.idInmueble}} : @{/inmuebles/}"
                          th:object="${inmueble}"
                          method="post"
                          enctype="multipart/form-data">

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <ul><li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li></ul>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Dirección</label>
                                <input type="text" class="form-control" th:field="*{direccion}"
                                       placeholder="Ej: Calle Mayor 12"
                                       th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}">Error</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Localidad</label>
                                <input type="text" class="form-control" th:field="*{localidad}" placeholder="Ej: Madrid">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Precio de Venta (€)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{precio}" placeholder="150000.00">
                        </div>

                        <hr class="my-4">

                        <h5 class="mb-3">Fotos del Inmueble</h5>
                        <div class="mb-3">
                            <label for="archivos" class="form-label">Selecciona las fotos</label>
                            <input class="form-control" type="file" id="archivos" name="archivos" multiple accept="image/*">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/inmuebles/}" class="btn btn-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-bold">Publicar Inmueble</button>
                        </div>

                    </form> </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
