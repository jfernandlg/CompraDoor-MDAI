<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Tarjetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Listado de Tarjetas</h1>
        <div>
            <a th:href="@{/tarjetas/menu}" class="btn btn-outline-secondary me-2">Menú Tarjetas</a>
            <a th:href="@{/tarjetas/new}" class="btn btn-success">Nueva Tarjeta</a>
        </div>
    </div>

    <div th:if="${tarjetas == null or #lists.isEmpty(tarjetas)}" class="alert alert-info">No hay Tarjetas</div>

    <table class="table table-striped" th:unless="${tarjetas == null or #lists.isEmpty(tarjetas)}">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Válida</th>
            <th>Cliente</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tarjetas}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.codigoTarjeta}"></td>
            <td th:text="${t.valida}"></td>
            <td th:text="${t.cliente != null ? t.cliente.nombre : 'N/A'}"></td>
            <td>
                <form th:action="@{/tarjetas/{id}/delete(id=${t.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
