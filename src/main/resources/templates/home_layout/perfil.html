<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Área Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 3rem 0 5rem; margin-bottom: -3rem;
        }
        .action-card {
            border: none; border-radius: 20px; transition: all 0.3s;
            text-decoration: none; color: inherit; display: block; height: 100%;
        }
        .action-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .icon-circle {
            width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem;
        }
        .bg-purple-light { background-color: rgba(118, 75, 162, 0.1); color: #764ba2; }
        .bg-green-light { background-color: rgba(16, 185, 129, 0.1); color: #10b981; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-transparent position-absolute w-100" style="z-index: 10;">
    <div class="container d-flex justify-content-between">
        <a th:href="@{/}" class="btn btn-outline-light rounded-pill btn-sm px-3">
            <i class="bi bi-arrow-left"></i> Volver al Inicio
        </a>
        <a th:href="@{/logout}" class="btn btn-danger rounded-pill btn-sm px-3 border-0 shadow-sm">
            Cerrar Sesión <i class="bi bi-box-arrow-right"></i>
        </a>
    </div>
</nav>

<div class="profile-header text-center shadow-sm">
    <div class="container pt-4">
        <div class="mb-3"><i class="bi bi-person-circle display-4"></i></div>
        <h1 class="fw-bold">Hola, <span th:text="${cliente.nombre}">Usuario</span></h1>
        <p class="opacity-75 mb-0">Esta es tu área personal de gestión.</p>
    </div>
</div>

<div class="container pb-5">
    <div class="row g-4 justify-content-center">
        <div class="col-md-5">
            <a th:href="@{/ventas/mis-ventas}" class="card action-card shadow p-4 text-center">
                <div class="icon-circle bg-green-light"><i class="bi bi-bag-heart-fill"></i></div>
                <h3 class="h4 fw-bold">Mis Compras</h3>
                <p class="text-muted small">Historial de inmuebles adquiridos.</p>
            </a>
        </div>
        <div class="col-md-5">
            <a th:href="@{/tarjetas/mis-tarjetas}" class="card action-card shadow p-4 text-center">
                <div class="icon-circle bg-purple-light"><i class="bi bi-credit-card-2-front-fill"></i></div>
                <h3 class="h4 fw-bold">Mis Tarjetas</h3>
                <p class="text-muted small">Gestiona tus métodos de pago.</p>
            </a>
        </div>
    </div>
</div>

</body>
</html>
