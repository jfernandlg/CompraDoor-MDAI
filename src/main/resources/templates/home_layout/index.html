<<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Compradoor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Fondo limpio y luminoso */
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
        }

        .hero-title {
            font-weight: 800; color: #2d3436; margin-bottom: 4rem;
        }

        /* GRID DE FIGURAS */
        .figure-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* EL CONCEPTO: NO ES UNA CAJA, ES UNA FIGURA (CÍRCULO) */
        .circle-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            group: hover;
        }

        .circle-figure {
            width: 140px;
            height: 140px;
            border-radius: 50%; /* <--- ESTO LO CONVIERTE EN CÍRCULO PERFECTO */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Efecto de brillo interior */
        .circle-figure::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
            border-radius: 50%;
        }

        .circle-link:hover .circle-figure {
            transform: translateY(-10px) scale(1.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }

        .label-text {
            font-weight: 700; color: #636e72; font-size: 1.2rem;
            transition: color 0.3s;
        }
        .circle-link:hover .label-text { color: #2d3436; }

        /* --- PALETA DE COLORES (FIGURAS) --- */

        /* Ventas: Naranja Fuego */
        .fig-ventas { background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); }

        /* Inmuebles: Azul Océano */
        .fig-inmuebles { background: linear-gradient(135deg, #1CB5E0 0%, #000851 100%); }

        /* Clientes: Violeta Mágico */
        .fig-clientes { background: linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%); }

        /* Servicios: Verde Esmeralda */
        .fig-servicios { background: linear-gradient(135deg, #02AAB0 0%, #00CDAC 100%); }

        /* Tarjetas: Amarillo/Oro */
        .fig-tarjetas { background: linear-gradient(135deg, #F2994A 0%, #F2C94C 100%); }

        /* --- DISEÑO ESPECIAL PARA EL PRINCIPAL (VENTAS) --- */
        /* Hacemos que el de Ventas sea un poco más grande para destacar */
        .circle-link.main-action .circle-figure {
            width: 160px; height: 160px; font-size: 5rem;
            box-shadow: 0 20px 40px rgba(221, 36, 118, 0.3);
        }

    </style>
</head>
<body>

<div class="container text-center py-5">

    <h1 class="display-4 hero-title">Panel de Control</h1>

    <div class="figure-grid">

        <a th:href="@{/ventas}" class="circle-link main-action">
            <div class="circle-figure fig-ventas">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <span class="label-text">Ventas</span>
        </a>

        <a th:href="@{/inmuebles/}" class="circle-link">
            <div class="circle-figure fig-inmuebles">
                <i class="bi bi-houses"></i>
            </div>
            <span class="label-text">Inmuebles</span>
        </a>

        <a th:href="@{/clientes}" class="circle-link">
            <div class="circle-figure fig-clientes">
                <i class="bi bi-people"></i>
            </div>
            <span class="label-text">Clientes</span>
        </a>

        <a th:href="@{/servicios/menu}" class="circle-link">
            <div class="circle-figure fig-servicios">
                <i class="bi bi-tools"></i>
            </div>
            <span class="label-text">Servicios</span>
        </a>

        <a th:href="@{/tarjetas/all}" class="circle-link">
            <div class="circle-figure fig-tarjetas">
                <i class="bi bi-credit-card-2-front"></i>
            </div>
            <span class="label-text">Tarjetas</span>
        </a>

    </div>

    <div class="mt-5 pt-5">
        <a th:href="@{/logout}" class="btn btn-outline-danger rounded-pill px-4">
            <i class="bi bi-power"></i> Salir
        </a>
    </div>

</div>

</body>
</html>
