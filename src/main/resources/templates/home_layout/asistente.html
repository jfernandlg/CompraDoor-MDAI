<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compradoor AI - Asistente Inteligente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/galaxy.css">

    <style>
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
        }
        /* Estilos para que la respuesta de la IA se lea bien */
        .ai-response ul { padding-left: 20px; }
        .ai-response li { margin-bottom: 8px; }

        /* Efecto hover suave para las tarjetas */
        .card-inmueble {
            transition: transform 0.2s ease-in-out;
        }
        .card-inmueble:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-5 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-robot"></i> Asistente IA
        </span>
        <a th:href="@{/}" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
    </div>
</nav>

<div class="container chat-container pb-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold text-primary mb-3">¿Qué estás buscando?</h1>
        <p class="lead text-muted">
            Describe tu casa ideal y deja que nuestra IA analice el catálogo por ti.
        </p>

        <div class="mt-4">
            <form th:action="@{/asistente/preguntar}" method="post">
                <div class="input-group input-group-lg shadow-sm">
                    <input type="text" name="pregunta" class="form-control border-primary"
                           placeholder="Ej: 'Busco un piso barato en el centro' o 'Casa familiar con 3 habitaciones'"
                           th:value="${preguntaUsuario}" required>
                    <button class="btn btn-primary px-4 fw-bold" type="submit">
                        <i class="bi bi-send-fill"></i> Consultar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${respuestaIA}" class="card shadow border-0 mb-5" style="border-left: 5px solid #6c5ce7 !important;">
        <div class="card-body p-4">

            <h5 class="text-muted mb-3">
                <i class="bi bi-person-circle me-2"></i> Tú preguntaste:
                <span class="text-dark fst-italic">"<span th:text="${preguntaUsuario}"></span>"</span>
            </h5>
            <hr>

            <div class="d-flex mb-4">
                <div class="me-3 fs-3 text-primary"><i class="bi bi-stars"></i></div>
                <div class="w-100">
                    <div class="ai-response fs-5" th:utext="${respuestaIA}">
                    </div>
                </div>
            </div>

            <div th:if="${not #lists.isEmpty(inmueblesRecomendados)}" class="mt-5 pt-4 border-top">

                <h4 class="text-primary mb-4">
                    <i class="bi bi-stars"></i>
                    <span th:text="${#lists.size(inmueblesRecomendados) > 1 ? 'Mejores resultados encontrados' : 'Mejor resultado encontrado'}">
                        Mejores resultados
                    </span>
                </h4>
                <div class="row row-cols-1 row-cols-md-3 g-4">
                    <div class="col" th:each="inmueble : ${inmueblesRecomendados}">
                        <div class="card h-100 border-0 shadow-sm card-inmueble">

                            <div style="height: 200px; overflow: hidden; background-color: #eee;">
                                <img th:if="${not #lists.isEmpty(inmueble.pathFotos)}"
                                     th:src="@{${inmueble.pathFotos[0]}}"
                                     class="card-img-top h-100 w-100"
                                     style="object-fit: cover;"
                                     alt="Foto inmueble">

                                <img th:if="${#lists.isEmpty(inmueble.pathFotos)}"
                                     src="https://via.placeholder.com/300x200?text=Sin+Foto"
                                     class="card-img-top h-100 w-100"
                                     style="object-fit: cover;"
                                     alt="Sin imagen">
                            </div>

                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title fw-bold mb-0" th:text="${inmueble.localidad}">Localidad</h5>
                                    <span class="badge bg-success rounded-pill"
                                          th:text="${inmueble.precio} + ' €'">0 €</span>
                                </div>
                                <p class="card-text small text-muted mb-2">
                                    <i class="bi bi-geo-alt-fill text-danger"></i>
                                    <span th:text="${inmueble.direccion}">Dirección</span>
                                </p>
                            </div>

                            <div class="card-footer bg-white border-0 pt-0 pb-3">
                                <div class="d-grid gap-2">
                                    <a th:href="@{/transaccion/confirmar(idInmueble=${inmueble.idInmueble})}"
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-cart-plus"></i> Ver Detalles / Comprar
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-5 text-end">
                <a th:href="@{/inmuebles/}" class="btn btn-sm btn-link text-decoration-none text-secondary">
                    Ver catálogo completo <i class="bi bi-arrow-right"></i>
                </a>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
