<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Compradoor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #a29bfe 0%, #74b9ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;}
        .login-card { background: rgba(255, 255, 255, 0.95); padding: 3rem; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px;}
    </style>
</head>
<body>

<div class="login-card text-center">
    <h2 class="fw-bold text-primary mb-4">Bienvenido</h2>

    <!-- Formulario Simulado (Sin Spring Security, esto no autentica realmente aún) -->
    <form th:action="@{/login}" method="post">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="mb-3 text-start">
            <label class="form-label fw-bold text-muted">Email</label>
            <input type="email" name="email" class="form-control form-control-lg bg-light border-0" placeholder="usuario@email.com" required>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label fw-bold text-muted">Contraseña</label>
            <input type="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">Entrar</button>
    </form>

    <div class="mt-4 border-top pt-3">
        <p class="text-muted small">¿No tienes cuenta?</p>
        <a th:href="@{/register}" class="btn btn-outline-secondary btn-sm rounded-pill w-100">Crear cuenta nueva</a>
        <br><br>
        <a th:href="@{/}" class="text-decoration-none text-muted small">Volver al Inicio</a>
    </div>
</div>

</body>
</html>
