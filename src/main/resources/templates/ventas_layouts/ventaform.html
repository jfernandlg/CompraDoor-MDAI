<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="card-title mb-0">Registrar Nueva Venta</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/ventas}" th:object="${venta}" method="post">

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</li>
                            </ul>
                        </div>

                        <div class="mb-3">
                            <label for="fechaVenta" class="form-label">Fecha de Venta</label>
                            <input type="date" class="form-control" id="fechaVenta" th:field="*{fechaVenta}"
                                   th:classappend="${#fields.hasErrors('fechaVenta')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaVenta')}" th:errors="*{fechaVenta}">
                                Error en la fecha
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="precioVenta" class="form-label">Precio Final (€)</label>
                            <input type="number" step="0.01" class="form-control" id="precioVenta" th:field="*{precioVenta}"
                                   placeholder="Ej: 150000.00"
                                   th:classappend="${#fields.hasErrors('precioVenta')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}">
                                Error en el precio
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="cliente" class="form-label">Comprador (Cliente)</label>
                            <select class="form-select" id="cliente" th:field="*{cliente}"
                                    th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid' : ''">
                                <option value="">-- Seleccione un Cliente --</option>
                                <option th:each="cli : ${listaClientes}"
                                        th:value="${cli.id}"
                                        th:text="${cli.nombre + ' - ' + cli.dni}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}">
                                Seleccione un cliente válido
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="inmueble" class="form-label">Inmueble Vendido</label>
                            <select class="form-select" id="inmueble" th:field="*{inmueble}"
                                    th:classappend="${#fields.hasErrors('inmueble')} ? 'is-invalid' : ''">
                                <option value="">-- Seleccione un Inmueble --</option>
                                <option th:each="inm : ${listaInmuebles}"
                                        th:value="${inm.idInmueble}"
                                        th:text="${inm.direccion + ' (' + inm.localidad + ') - ' + inm.precio + '€'}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('inmueble')}" th:errors="*{inmueble}">
                                Seleccione un inmueble válido
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/ventas}" class="btn btn-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-success">Registrar Venta</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
