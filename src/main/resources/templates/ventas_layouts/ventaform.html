<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin"><i class="bi bi-shield-lock-fill"></i> Panel Admin</a>
        <a th:href="@{/ventas}" class="btn btn-outline-light btn-sm">Volver al Listado</a>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0">

                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-currency-dollar"></i> Registrar Nueva Venta</h4>
                    <p class="mb-0 small opacity-75">Formalización de contrato de compraventa</p>
                </div>

                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/ventas}" th:object="${venta}" method="post">

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger d-flex align-items-center">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <div>
                                <ul class="mb-0 ps-3">
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</li>
                                </ul>
                            </div>
                        </div>

                        <div class="row g-4">

                            <div class="col-12">
                                <label for="cliente" class="form-label fw-bold text-success">
                                    <i class="bi bi-person-fill"></i> Cliente Comprador
                                </label>
                                <select class="form-select form-select-lg" id="cliente" th:field="*{cliente}"
                                        th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid' : ''">
                                    <option value="">-- Seleccione un Cliente --</option>
                                    <option th:each="c : ${listaClientes}"
                                            th:value="${c.id}"
                                            th:text="${c.nombre + ' (DNI: ' + c.dni + ')'}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}">
                                    Seleccione un cliente válido
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="inmueble" class="form-label fw-bold text-success">
                                    <i class="bi bi-house-door-fill"></i> Inmueble Disponible
                                </label>
                                <select class="form-select form-select-lg" id="inmueble" th:field="*{inmueble}"
                                        onchange="actualizarPrecio()"
                                        th:classappend="${#fields.hasErrors('inmueble')} ? 'is-invalid' : ''">
                                    <option value="" data-precio="0">-- Seleccione un Inmueble --</option>

                                    <option th:each="inm : ${listaInmuebles}"
                                            th:value="${inm.idInmueble}"
                                            th:data-precio="${inm.precio}"
                                            th:text="${inm.direccion + ' | ' + inm.localidad}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('inmueble')}" th:errors="*{inmueble}">
                                    Seleccione un inmueble válido
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="fechaVenta" class="form-label fw-bold">
                                    <i class="bi bi-calendar-event"></i> Fecha de Firma
                                </label>
                                <input type="date" class="form-control" id="fechaVenta" th:field="*{fechaVenta}"
                                       th:classappend="${#fields.hasErrors('fechaVenta')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaVenta')}" th:errors="*{fechaVenta}">
                                    La fecha es obligatoria
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="precioVenta" class="form-label fw-bold">
                                    <i class="bi bi-tag-fill"></i> Precio Final (€)
                                </label>
                                <input type="number" step="0.01" class="form-control" id="precioVenta" th:field="*{precioVenta}" readonly>
                            </div>

                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                            <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm">
                                <i class="bi bi-check-lg"></i> Confirmar Venta
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function actualizarPrecio() {
        // 1. Obtener el select del inmueble
        var select = document.getElementById("inmueble");

        // 2. Obtener la opción seleccionada
        var selectedOption = select.options[select.selectedIndex];

        // 3. Leer el atributo data-precio
        var precio = selectedOption.getAttribute("data-precio");

        // 4. Poner el valor en el input de precio
        var inputPrecio = document.getElementById("precioVenta");

        if (precio) {
            inputPrecio.value = precio;
        } else {
            inputPrecio.value = "";
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
