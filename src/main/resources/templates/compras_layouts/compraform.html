<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${compra.idCompra != null} ? 'Editar Compra' : 'Nueva Compra'"></title>
    <link rel="stylesheet" th:href="@{/css/galaxy.css}">
    <script>
        // Lógica para mostrar/ocultar el formulario de servicio extra
        function toggleServicio() {
            var checkbox = document.getElementById('checkServicio');
            var bloque = document.getElementById('bloqueServicio');
            if (checkbox.checked) {
                bloque.style.display = 'block';
                // Hacemos required los campos si se muestra el bloque
                document.getElementById('srvTipo').setAttribute('required', 'required');
                document.getElementById('srvDesc').setAttribute('required', 'required');
            } else {
                bloque.style.display = 'none';
                // Quitamos required si se oculta
                document.getElementById('srvTipo').removeAttribute('required');
                document.getElementById('srvDesc').removeAttribute('required');
            }
        }
    </script>
</head>
<body>
<div class="galaxy-container">
    <header class="galaxy-header">
        <h1 th:text="${compra.idCompra != null} ? '✏️ Editar Compra' : '✨ Nueva Compra'"></h1>
    </header>

    <div class="cosmic-card">
        <form th:action="${compra.idCompra != null} ? @{/compras/update/{id}(id=${compra.idCompra})} : @{/compras/save}"
              th:object="${compra}" method="post" class="cosmic-form">

            <div th:if="${error}" class="cosmic-alert alert-error">
                ❌ <span th:text="${error}"></span>
            </div>

            <div th:if="${#fields.hasErrors('*')}" class="cosmic-alert alert-error">
                ❌ Revisa los campos marcados
            </div>

            <div class="form-group">
                <label>👤 Cliente:</label>
                <select th:field="*{cliente}" class="form-control" required>
                    <option value="">-- Seleccionar --</option>
                    <option th:each="c : ${clientes}"
                            th:value="${c.id}"
                            th:text="${c.nombre + ' (' + c.dni + ')'}"></option>
                </select>
                <span th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}" style="color: #ff6b6b;"></span>
            </div>

            <div class="form-group">
                <label>🏠 Inmueble:</label>
                <select th:field="*{inmueble}" class="form-control" required>
                    <option value="">-- Seleccionar --</option>
                    <option th:each="i : ${inmuebles}"
                            th:value="${i.idInmueble}"
                            th:text="${i.direccion + ' - ' + i.localidad}"></option>
                </select>
                <span th:if="${#fields.hasErrors('inmueble')}" th:errors="*{inmueble}" style="color: #ff6b6b;"></span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>📅 Fecha:</label>
                    <input type="date" th:field="*{fechaCompra}" class="form-control" required>
                    <span th:if="${#fields.hasErrors('fechaCompra')}" th:errors="*{fechaCompra}" style="color: #ff6b6b;"></span>
                </div>

                <div class="form-group">
                    <label>💰 Precio:</label>
                    <input type="number" step="0.01" th:field="*{precioCompra}" class="form-control" required>
                    <span th:if="${#fields.hasErrors('precioCompra')}" th:errors="*{precioCompra}" style="color: #ff6b6b;"></span>
                </div>
            </div>

            <hr style="border-color: rgba(255,255,255,0.2); margin: 2rem 0;">

            <div th:if="${compra.idCompra == null}" style="background: rgba(255,255,255,0.8); padding: 1.5rem; border-radius: 15px; border: 2px dashed var(--primary-color);">

                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;">
                    <input type="checkbox" id="checkServicio" name="agregarServicio" onchange="toggleServicio()" style="width: 20px; height: 20px;">
                    <label for="checkServicio" style="font-weight: bold; color: var(--primary-color); cursor: pointer; font-size: 1.1em;">
                        ➕ ¿Contratar Servicio Adicional? (Limpieza, Reformas...)
                    </label>
                </div>

                <div id="bloqueServicio" style="display: none; animation: fadeIn 0.5s;">
                    <div class="form-group">
                        <label>🏷️ Tipo Servicio:</label>
                        <select name="srvTipo" id="srvTipo" class="form-control">
                            <option value="">-- Seleccionar Tipo --</option>
                            <option th:each="t : ${tiposServicio}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📝 Descripción:</label>
                        <input type="text" name="srvDesc" id="srvDesc" class="form-control" placeholder="Ej: Pintura completa del salón">
                    </div>
                    <div class="form-group">
                        <label>💶 Coste Extra (€):</label>
                        <input type="number" step="0.01" name="srvCoste" class="form-control" value="0">
                    </div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 2rem;">
                <button type="submit" class="galaxy-btn">💾 Guardar Operación</button>
                <a th:href="@{/compras/all}" class="galaxy-btn btn-danger">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
