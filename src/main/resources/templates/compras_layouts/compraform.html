<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${compra.idCompra != null} ? 'Editar Compra' : 'Nueva Compra'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function toggleServicio() {
            var check = document.getElementById('checkServicio');
            var bloque = document.getElementById('bloqueServicio');
            var inputs = bloque.querySelectorAll('input, select');

            if (check.checked) {
                bloque.classList.remove('d-none');
                inputs.forEach(i => i.setAttribute('required', ''));
            } else {
                bloque.classList.add('d-none');
                inputs.forEach(i => i.removeAttribute('required'));
            }
        }
    </script>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <span th:text="${compra.idCompra != null} ? '✏️ Editar Registro' : '📝 Registrar Nueva Compra'"></span>
                    </h4>
                </div>

                <div class="card-body p-4 p-md-5">

                    <form th:action="${compra.idCompra != null} ? @{/compras/update/{id}(id=${compra.idCompra})} : @{/compras/save}"
                          th:object="${compra}" method="post">

                        <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span></div>
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-warning">Por favor revisa los campos marcados.</div>

                        <h6 class="text-uppercase text-muted fw-bold mb-3 small ls-1">Datos de la Transacción</h6>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Cliente Comprador</label>
                                <select th:field="*{cliente}" class="form-select" required>
                                    <option value="">-- Seleccionar --</option>
                                    <option th:each="c : ${clientes}"
                                            th:value="${c.id}"
                                            th:text="${c.nombre + ' (' + c.dni + ')'}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Inmueble</label>
                                <select th:field="*{inmueble}" class="form-select" required>
                                    <option value="">-- Seleccionar --</option>
                                    <option th:each="i : ${inmuebles}"
                                            th:value="${i.idInmueble}"
                                            th:text="${i.direccion}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('inmueble')}" th:errors="*{inmueble}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha de Firma</label>
                                <input type="date" th:field="*{fechaCompra}" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Precio Final (€)</label>
                                <div class="input-group">
                                    <input type="number" step="0.01" th:field="*{precioCompra}" class="form-control" required>
                                    <span class="input-group-text">€</span>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="bg-light p-4 rounded border">
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="checkServicio" onchange="toggleServicio()">
                                <label class="form-check-label fw-bold text-primary" for="checkServicio">
                                    ¿Añadir Servicio Adicional? (Limpieza, Reformas...)
                                </label>
                            </div>

                            <div id="bloqueServicio" class="d-none">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Tipo de Servicio</label>
                                        <select name="srvTipo" id="srvTipo" class="form-select">
                                            <option value="">Seleccionar...</option>
                                            <option th:each="t : ${tiposServicio}" th:value="${t}" th:text="${t}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Coste Extra</label>
                                        <div class="input-group">
                                            <input type="number" step="0.01" name="srvCoste" class="form-control" value="0">
                                            <span class="input-group-text">€</span>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Descripción</label>
                                        <input type="text" name="srvDesc" id="srvDesc" class="form-control" placeholder="Ej: Pintura salón">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/compras/all}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-bold px-4">Guardar Compra</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
