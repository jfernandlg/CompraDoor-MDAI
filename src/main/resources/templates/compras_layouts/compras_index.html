<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .menu-card { transition: transform 0.3s; border: none; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .icon-box { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; border-radius: 12px; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold text-primary display-5">Portal de Compras</h1>
        <p class="text-muted lead">Gestión centralizada de transacciones inmobiliarias</p>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-md-6 col-lg-4">
            <div class="card menu-card shadow h-100 p-3">
                <div class="card-body text-center">
                    <div class="icon-box bg-primary text-white mx-auto mb-3">
                        <i class="bi bi-list-columns-reverse"></i>
                    </div>
                    <h3 class="h4 fw-bold">Historial</h3>
                    <p class="text-muted mb-4">Consulta el registro completo de todas las operaciones realizadas.</p>
                    <a th:href="@{/compras/all}" class="btn btn-outline-primary w-100 stretched-link">Ver Listado</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card menu-card shadow h-100 p-3">
                <div class="card-body text-center">
                    <div class="icon-box bg-success text-white mx-auto mb-3">
                        <i class="bi bi-cart-plus"></i>
                    </div>
                    <h3 class="h4 fw-bold">Nueva Compra</h3>
                    <p class="text-muted mb-4">Registra una nueva transacción manualmente en el sistema.</p>
                    <a th:href="@{/compras/new}" class="btn btn-outline-success w-100 stretched-link">Crear Registro</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card menu-card shadow h-100 p-3 bg-white">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <div class="icon-box bg-info text-white me-3" style="width: 40px; height: 40px; font-size: 1.2rem;">
                            <i class="bi bi-search"></i>
                        </div>
                        <h5 class="fw-bold mb-0">Búsqueda Rápida</h5>
                    </div>

                    <form action="/compras/buscar" method="get">
                        <div class="mb-2">
                            <input type="text" name="clienteId" class="form-control form-control-sm bg-light" placeholder="DNI Cliente...">
                        </div>
                        <div class="mb-3">
                            <input type="text" name="inmuebleId" class="form-control form-control-sm bg-light" placeholder="ID Inmueble...">
                        </div>
                        <button type="submit" class="btn btn-info text-white w-100 btn-sm fw-bold">Buscar</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <a th:href="@{/admin}" class="btn btn-link text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> Volver al Panel Admin
        </a>
    </div>

</div>

</body>
</html>
