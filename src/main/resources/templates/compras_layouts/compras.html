<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body { background-color: #f8f9fa; }
        .table-hover tbody tr:hover { background-color: #f1f3f5; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin"><i class="bi bi-shield-lock-fill"></i> Panel Admin</a>
        <a th:href="@{/compras/menu}" class="btn btn-outline-light btn-sm">Volver al Menú</a>
    </div>
</nav>

<div class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-primary mb-0">
                <i class="bi bi-receipt-cutoff"></i> Gestión de Compras
            </h2>
            <p class="text-muted mb-0 small">Historial completo de transacciones</p>
        </div>
        <a th:href="@{/compras/new}" class="btn btn-success fw-bold shadow-sm">
            <i class="bi bi-plus-lg"></i> Nueva Compra
        </a>
    </div>

    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-white py-3">
            <button class="btn btn-outline-primary w-100 text-start d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#filtrosCollapse">
                <span><i class="bi bi-sliders"></i> Filtros y Búsqueda Avanzada</span>
                <i class="bi bi-chevron-down"></i>
            </button>
        </div>
        <div class="collapse show" id="filtrosCollapse">
            <div class="card-body bg-light">
                <form th:action="@{/compras/buscar}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small text-muted fw-bold">Cliente (DNI/Nombre)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" name="clienteId" th:value="${clienteId}" class="form-control" placeholder="Buscar...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted fw-bold">Inmueble (ID/Dir)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-house"></i></span>
                            <input type="text" name="inmuebleId" th:value="${inmuebleId}" class="form-control" placeholder="Buscar...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted fw-bold">Fecha Desde</label>
                        <input type="date" name="fechaInicio" th:value="${#dates.format(fechaInicio, 'yyyy-MM-dd')}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted fw-bold">Ordenar por</label>
                        <select name="orden" class="form-select">
                            <option value="">-- Defecto --</option>
                            <option value="fecha_desc" th:selected="${ordenSeleccionado == 'fecha_desc'}">📅 Más recientes</option>
                            <option value="precio_desc" th:selected="${ordenSeleccionado == 'precio_desc'}">💰 Mayor Precio</option>
                        </select>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                        <a th:if="${filtrosAplicados}" th:href="@{/compras/all}" class="btn btn-outline-secondary btn-sm">Limpiar</a>
                        <button type="submit" class="btn btn-primary btn-sm px-4">Aplicar Filtros</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div th:if="${compras.empty}" class="text-center py-5 text-muted">
                <i class="bi bi-inbox display-4 d-block mb-3"></i>
                No se encontraron compras.
            </div>

            <div class="table-responsive" th:unless="${compras.empty}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary text-uppercase small">
                    <tr>
                        <th class="ps-4">Fecha</th>
                        <th>Cliente</th>
                        <th>Inmueble</th>
                        <th>Precio</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="compra : ${compras}">
                        <td class="ps-4 fw-bold text-muted" th:text="${#dates.format(compra.fechaCompra, 'dd/MM/yyyy')}"></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="bg-light rounded-circle p-2 me-2 text-primary"><i class="bi bi-person-fill"></i></div>
                                <span th:text="${compra.cliente?.nombre}">Nombre</span>
                            </div>
                        </td>
                        <td>
                            <div class="small">
                                <i class="bi bi-geo-alt text-danger"></i>
                                <span th:text="${compra.inmueble?.direccion}">Dirección</span>
                            </div>
                        </td>
                        <td class="fw-bold text-success" th:text="${compra.precioCompra} + ' €'"></td>
                        <td class="text-end pe-4">
                            <div class="btn-group">
                                <a th:href="@{/compras/edit/{id}(id=${compra.idCompra})}" class="btn btn-outline-primary btn-sm" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/compras/delete/{id}(id=${compra.idCompra})}" method="post" onsubmit="return confirm('¿Eliminar registro?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-0 rounded-end" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white text-muted small py-3">
            Mostrando <strong th:text="${compras.size()}"></strong> resultados.
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
