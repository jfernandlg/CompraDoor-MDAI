<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Listado de Compras</h1>
        <div>
            <a th:href="@{/compras/menu}" class="btn btn-outline-secondary me-2">Menú Compras</a>
            <a th:href="@{/compras/new}" class="btn btn-success">Nueva Compra</a>
        </div>
    </div>

    <div th:if="${compras == null or #lists.isEmpty(compras)}" class="alert alert-info">No hay Compras registradas</div>

    <table class="table table-striped" th:unless="${compras == null or #lists.isEmpty(compras)}">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Inmueble</th>
            <th>Fecha</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${compras}">
            <td th:text="${c.idCompra}"></td>
            <td th:text="${c.cliente != null ? c.cliente.nombre : 'N/A'}"></td>
            <td th:text="${c.inmueble != null ? c.inmueble.direccion : 'N/A'}"></td>
            <td th:text="${c.fechaCompra != null ? #dates.format(c.fechaCompra, 'yyyy-MM-dd HH:mm') : '-'}"></td>
            <td th:text="${c.precioCompra}"></td>
            <td>
                <form th:action="@{/compras/{id}/delete(id=${c.idCompra})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
                <a th:href="@{/compras/edit/{id}(id=${c.idCompra})}" class="btn btn-primary btn-sm">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
