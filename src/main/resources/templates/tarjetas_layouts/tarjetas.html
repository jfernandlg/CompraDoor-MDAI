<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administración de Tarjetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body { background-color: #f8f9fa; } /* Fondo gris suave unificado */
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); } /* Tarjetas modernas */
        .table-hover tbody tr:hover { background-color: #f1f3f5; }
        .font-monospace { letter-spacing: 1px; } /* Para que los números de tarjeta se vean técnicos */
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">
            <i class="bi bi-shield-lock-fill"></i> Panel Admin
        </a>
        <div class="d-flex gap-2">
            <a th:href="@{/admin}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Volver al Menú
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-primary mb-0">💳 Listado de Tarjetas</h2>
            <p class="text-muted">Gestión centralizada de métodos de pago</p>
        </div>
        <a th:href="@{/tarjetas/new}" class="btn btn-success shadow-sm">
            <i class="bi bi-plus-lg"></i> Nueva Tarjeta
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <div th:if="${tarjetas == null or #lists.isEmpty(tarjetas)}" class="alert alert-info m-3">
                <i class="bi bi-info-circle"></i> No hay tarjetas registradas en el sistema.
            </div>

            <div class="table-responsive" th:unless="${tarjetas == null or #lists.isEmpty(tarjetas)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Código de Tarjeta</th>
                        <th>Estado</th>
                        <th>Titular (Cliente)</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${tarjetas}">
                        <td class="ps-4 font-monospace text-dark fw-bold" th:text="${t.codigoTarjeta}">
                            0000 0000 0000 0000
                        </td>

                        <td>
                            <span th:if="${t.valida}" class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2 rounded-pill">
                                <i class="bi bi-check-circle-fill"></i> Activa
                            </span>
                            <span th:unless="${t.valida}" class="badge bg-danger bg-opacity-10 text-danger border border-danger px-3 py-2 rounded-pill">
                                <i class="bi bi-x-circle-fill"></i> Bloqueada
                            </span>
                        </td>

                        <td>
                            <div th:if="${t.cliente != null}">
                                <i class="bi bi-person text-primary"></i>
                                <span th:text="${t.cliente.nombre}">Nombre</span>
                                <small class="text-muted d-block" style="font-size: 0.8rem;" th:text="${t.cliente.dni}">DNI</small>
                            </div>
                            <span th:if="${t.cliente == null}" class="text-muted fst-italic">Sin asignar</span>
                        </td>

                        <td class="text-end pe-4">
                            <form th:action="@{/tarjetas/{id}/delete(id=${t.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('¿Estás seguro de eliminar esta tarjeta?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white text-muted small py-3">
            Total registrados: <strong th:text="${tarjetas.size()}"></strong> tarjetas.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
