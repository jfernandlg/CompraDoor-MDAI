<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Mis Tarjetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }

        /* Tarjeta estilo "Black Card" moderna */
        .credit-card {
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            color: white; border-radius: 20px; padding: 25px;
            height: 220px; position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.3s;
            overflow: hidden;
        }
        .credit-card:hover { transform: translateY(-5px); }

        /* Estado visual: Si está inactiva, se ve en blanco y negro (gris) */
        .card-inactive { filter: grayscale(100%); opacity: 0.8; }

        .chip {
            width: 50px; height: 35px;
            background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
            border-radius: 6px; margin-bottom: 15px;
        }

        .card-number { font-family: 'Courier New', monospace; font-size: 1.5rem; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .card-holder { font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; }

        /* Botonera de acciones */
        .card-actions {
            margin-top: 15px; display: flex; gap: 10px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-5">
    <div class="container">
        <a th:href="@{/perfil}" class="btn btn-outline-secondary border-0 fw-bold">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <span class="navbar-brand fw-bold mx-auto">Mi Billetera</span>
        <a th:href="@{/tarjetas/mis-tarjetas/new}" class="btn btn-dark rounded-pill px-4 shadow-sm">
            <i class="bi bi-plus-lg"></i> Nueva Tarjeta
        </a>
    </div>
</nav>

<div class="container pb-5">

    <div th:if="${tarjetas.empty}" class="text-center py-5 opacity-50">
        <i class="bi bi-wallet2 display-1"></i>
        <h3 class="mt-3">Tu billetera está vacía</h3>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${tarjetas.empty}">

        <div class="col" th:each="t : ${tarjetas}">
            <div class="d-flex flex-column h-100">

                <div class="credit-card" th:classappend="${!t.valida} ? 'card-inactive'">

                    <div class="d-flex justify-content-between align-items-start">
                        <div class="chip"></div>
                        <i class="bi bi-wifi fs-3 text-white opacity-50"></i>
                    </div>

                    <div class="card-number" th:text="${t.codigoTarjeta}">0000 0000 0000 0000</div>

                    <div class="d-flex justify-content-between align-items-end">
                        <div>
                            <small class="d-block text-white-50" style="font-size: 0.6rem;">TITULAR</small>
                            <span class="card-holder" th:text="${t.cliente.nombre}">NOMBRE</span>
                        </div>
                        <span th:if="${t.valida}" class="badge bg-success bg-opacity-75 text-white border border-white">ACTIVA</span>
                        <span th:unless="${t.valida}" class="badge bg-secondary border border-white">BLOQUEADA</span>
                    </div>
                </div>

                <div class="card-actions">

                    <form th:action="@{/tarjetas/mis-tarjetas/{id}/toggle(id=${t.id})}" method="post" class="flex-grow-1">
                        <button th:if="${t.valida}" type="submit" class="btn btn-outline-secondary w-100 btn-sm" title="Bloquear temporalmente">
                            <i class="bi bi-lock-fill"></i> Bloquear
                        </button>
                        <button th:unless="${t.valida}" type="submit" class="btn btn-success w-100 btn-sm shadow-sm" title="Activar para compras">
                            <i class="bi bi-unlock-fill"></i> Activar
                        </button>
                    </form>

                    <form th:action="@{/tarjetas/mis-tarjetas/{id}/delete(id=${t.id})}" method="post"
                          onsubmit="return confirm('¿Seguro que quieres eliminar esta tarjeta?');">
                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Eliminar definitivamente">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
