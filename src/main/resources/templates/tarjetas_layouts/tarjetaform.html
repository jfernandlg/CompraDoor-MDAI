<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestión de Tarjeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-credit-card-2-front me-2"></i>
                        <span th:text="${tarjeta.id == null ? 'Registrar Nueva Tarjeta' : 'Editar Tarjeta'}"></span>
                    </h4>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/tarjetas/save}" th:object="${tarjeta}" method="post">

                        <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error}"></span>
                        </div>

                        <div class="mb-4">
                            <label for="codigo" class="form-label fw-bold text-muted">Código de Tarjeta</label>
                            <input id="codigo" class="form-control form-control-lg font-monospace text-center"
                                   th:field="*{codigoTarjeta}"
                                   th:classappend="${#fields.hasErrors('codigoTarjeta')} ? 'is-invalid' : ''"
                                   placeholder="0000 0000 0000 0000" maxlength="19"/>
                            <div class="invalid-feedback text-center" th:errors="*{codigoTarjeta}">Error</div>
                            <div class="form-text text-center small">Introduce los 16 dígitos sin espacios extra.</div>
                        </div>

                        <div class="card bg-light border-0 p-3 mb-4">
                            <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0">
                                <label for="valida" class="form-check-label fw-bold ms-5">¿Tarjeta Activa?</label>
                                <input id="valida" type="checkbox" class="form-check-input ms-3"
                                       style="width: 3em; height: 1.5em; cursor: pointer;"
                                       th:field="*{valida}" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="cliente" class="form-label fw-bold text-muted">Asignar a Titular</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <select id="cliente" class="form-select" th:field="*{cliente}"
                                        th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid' : ''">
                                    <option value="">-- Selecciona un cliente --</option>
                                    <option th:each="c : ${clientes}"
                                            th:value="${c.id}"
                                            th:text="${c.nombre + ' (' + c.dni + ')'}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{cliente}">Error</div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end pt-2">
                            <a th:href="@{/tarjetas/all}" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/admin}" class="text-decoration-none text-muted small">
                    <i class="bi bi-grid-fill"></i> Volver al Panel de Administración
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
