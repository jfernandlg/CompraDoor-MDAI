<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Nueva Tarjeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-credit-card"></i> Añadir Tarjeta</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/tarjetas/mis-tarjetas/save}" th:object="${tarjeta}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">Número de Tarjeta</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-credit-card-2-front"></i></span>
                                <input class="form-control form-control-lg font-monospace"
                                       id="inputTarjeta"
                                       th:field="*{codigoTarjeta}"
                                       placeholder="0000 0000 0000 0000"
                                       maxlength="19"
                                       th:classappend="${#fields.hasErrors('codigoTarjeta')} ? 'is-invalid' : ''"/>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('codigoTarjeta')}" th:errors="*{codigoTarjeta}">Error</div>
                            <div class="form-text small">Tus datos están encriptados y seguros.</div>
                        </div>

                        <div class="mb-4 form-check form-switch p-3 bg-light rounded">
                            <input id="valida" type=\"checkbox\" class="form-check-input ms-0 me-3" th:field="*{valida}" checked style="cursor: pointer;"/>
                            <label for="valida" class="form-check-label fw-bold" style="cursor: pointer;">Activar Tarjeta Inmediatamente</label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                                <i class="bi bi-lock-fill"></i> Guardar Tarjeta Segura
                            </button>
                            <a th:href="@{/tarjetas/mis-tarjetas}" class="btn btn-outline-secondary btn-sm mt-2">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3 text-muted small">
                <i class="bi bi-shield-check"></i> Pagos procesados por Compradoor Secure
            </div>
        </div>
    </div>
</div>

<script>
    // Script para formatear la tarjeta con espacios cada 4 dígitos
    document.getElementById('inputTarjeta').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');
        let formattedValue = value.replace(/(\d{4})(?=\d)/g, '$1 ');
        e.target.value = formattedValue;
    });
</script>

</body>
</html>
