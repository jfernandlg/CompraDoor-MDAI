<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">🛠️ Registrar Nuevo Servicio</h4>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/servicios/save}" th:object="${servicio}" method="post">

                        <div th:if="${error}" class="alert alert-danger">
                            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
                        </div>
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-warning">
                            <ul>
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error</li>
                            </ul>
                        </div>

                        <h6 class="text-uppercase text-muted fw-bold mb-3 small ls-1">Detalles del Servicio</h6>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Tipo de Servicio</label>
                            <select th:field="*{tipoServicio}" class="form-select" required>
                                <option value="">-- Seleccionar Tipo --</option>
                                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
                            </select>
                        </div>

                        <div class="mb-4 bg-light p-3 rounded border">
                            <label class="form-label fw-bold text-primary">
                                <i class="bi bi-link-45deg"></i> Vinculación (Opcional)
                            </label>
                            <div class="form-text mb-2 text-muted small">
                                Dejar vacío para crear una <strong>Plantilla de Catálogo</strong>.
                            </div>

                            <select name="compraId" class="form-select">
                                <option value="">-- Sin asignar (Modo Catálogo) --</option>
                                <option th:each="c : ${compras}"
                                        th:value="${c.idCompra}"
                                        th:text="${c.inmueble.direccion + ' (' + c.cliente.nombre + ')'}"
                                        th:selected="${servicio.compra != null and c.idCompra == servicio.compra.idCompra}">
                                </option>
                            </select>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Fecha</label>
                                <input type="date" th:field="*{fechaAplicacion}" class="form-control">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Descripción</label>
                                <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Ej: Limpieza..." required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Coste (€)</label>
                            <div class="input-group">
                                <input type="number" step="0.01" th:field="*{coste}" class="form-control" placeholder="0.00" required>
                                <span class="input-group-text">€</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/servicios/all}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-bold px-4">Guardar</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
