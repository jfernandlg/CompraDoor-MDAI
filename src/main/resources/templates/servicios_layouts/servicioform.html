<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">🛠️ Registrar Nuevo Servicio</h4>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/servicios/save}" th:object="${servicio}" method="post">

                        <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span></div>
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-warning">Revisa los campos marcados.</div>

                        <h6 class="text-uppercase text-muted fw-bold mb-3 small ls-1">Detalles del Trabajo</h6>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Asociar a Compra Existente</label>
                            <select th:field="*{compra}" class="form-select" required>
                                <option value="">-- Seleccionar Compra --</option>
                                <option th:each="c : ${compras}"
                                        th:value="${c.idCompra}"
                                        th:text="${c.cliente.nombre + ' | ' + c.inmueble.direccion + ' (' + #dates.format(c.fechaCompra, 'dd/MM/yyyy') + ')'}">
                                </option>
                            </select>
                            <div class="form-text">El coste se sumará al total de la compra seleccionada.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Categoría</label>
                                <select th:field="*{tipoServicio}" class="form-select" required>
                                    <option value="">-- Seleccionar --</option>
                                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha Aplicación</label>
                                <input type="date" th:field="*{fechaAplicacion}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Ej: Pintura de 2 habitaciones y pasillo" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Coste (€)</label>
                            <div class="input-group">
                                <input type="number" step="0.01" th:field="*{coste}" class="form-control" required>
                                <span class="input-group-text">€</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/servicios/all}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-bold px-4">Guardar Servicio</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
