<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .menu-card { transition: transform 0.3s; border: none; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .icon-box { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; border-radius: 12px; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold text-primary display-5">Administración de Servicios</h1>
        <p class="text-muted lead">Control total de mantenimientos y extras</p>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-md-6 col-lg-4">
            <div class="card menu-card shadow h-100 p-4">
                <div class="card-body text-center">
                    <div class="icon-box bg-primary text-white mx-auto mb-3">
                        <i class="bi bi-clipboard-data"></i>
                    </div>
                    <h3 class="h4 fw-bold">Catálogo</h3>
                    <p class="text-muted mb-4">Consultar, filtrar y eliminar servicios contratados.</p>
                    <a th:href="@{/servicios/all}" class="btn btn-outline-primary w-100 stretched-link">Ver Listado</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card menu-card shadow h-100 p-4">
                <div class="card-body text-center">
                    <div class="icon-box bg-warning text-white mx-auto mb-3">
                        <i class="bi bi-tools"></i>
                    </div>
                    <h3 class="h4 fw-bold">Añadir Manual</h3>
                    <p class="text-muted mb-4">Crear un servicio extra y asignarlo a una compra.</p>
                    <a th:href="@{/servicios/new}" class="btn btn-outline-warning text-dark w-100 stretched-link">Nuevo Servicio</a>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <a th:href="@{/admin}" class="btn btn-link text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> Volver al Panel Admin
        </a>
    </div>

</div>

</body>
</html>
