<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>.menu-card:hover { transform: translateY(-5px); }</style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-5 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">Panel Admin</a>
        <a th:href="@{/admin}" class="btn btn-outline-light btn-sm">Volver</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-primary">Gestión de Servicios</h1>
        <p class="lead text-muted">Administra reparaciones y configura el catálogo de precios</p>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-md-4">
            <div class="card menu-card shadow h-100 p-4 text-center">
                <div class="card-body">
                    <i class="bi bi-list-check display-4 text-primary mb-3"></i>
                    <h3 class="h4 fw-bold">Ver Listado</h3>
                    <p class="text-muted">Consulta todos los servicios, tanto los contratados como las plantillas.</p>
                    <a th:href="@{/servicios/all}" class="btn btn-outline-primary w-100 stretched-link">Acceder</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card menu-card shadow h-100 p-4 text-center border-warning">
                <div class="card-body">
                    <i class="bi bi-plus-circle-fill display-4 text-warning mb-3"></i>
                    <h3 class="h4 fw-bold">Crear Servicio</h3>
                    <p class="text-muted">Añade una reparación a un cliente o crea una nueva plantilla de precio.</p>
                    <a th:href="@{/servicios/new}" class="btn btn-warning w-100 stretched-link fw-bold">Crear Nuevo</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
