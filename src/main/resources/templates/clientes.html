<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Lista de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="row mb-4">Gestión de Clientes</h1>
    <div class="row mb-3">
        <div class="col-md-8">
            <form th:action="@{/clientes/search}" method="get" class="d-flex">
                <input type="text" name="query" class="form-control me-2" placeholder="Buscar por DNI...">
                <button type="submit" class="btn btn-outline-primary">Buscar</button>
                <a th:href="@{/clientes/}" class="btn btn-outline-secondary ms-2" title="Limpiar Búsqueda">Limpiar</a>
            </form>
        </div>
        <div class="col-md-4 text-end">
            <a th:href="@{/clientes/new}" class="btn btn-success">
                <i class="bi bi-person-plus-circle"></i>Nuevo Cliente
            </a>
        </div>
    </div>

    <div th:if="@{error}" class="alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${clientes.empty}" class="alert alert-info">
        No hay Clientes registrados
    </div>

    <table class="table table-striped table-hover" th:unless="${clientes.empty}">
        <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.id}"></td>
            <td th:text="${cliente.dni}"></td>
            <td th:text="${cliente.nombre}"></td>
            <td th:text="${cliente.email}"></td>
            <td th:text="${cliente.telefono}"></td>
            <td>
                <a th:href="@{/clientes/edit/{id}(id=${cliente.id})}" class="btn btn-sm btn-primary">
                    <i class="bi bi-pencil"></i>Editar
                </a>

                <form th:action="@{/clientes/{id}/delete(id=${cliente.id})}" method="post" style="display: inline;"
                      onsubmit="return confirm('¿Estás seguro de borrar este cliente?');">
                    <button type="submit" class="btn btn-sm btn-danger">
                        <i class="bi bi-trash"></i>Borrar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
