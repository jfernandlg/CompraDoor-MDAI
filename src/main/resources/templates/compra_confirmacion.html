<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Confirmar Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center py-3">
                    <h3 class="mb-0"><i class="bi bi-cart-check"></i> Confirmar Adquisición</h3>
                </div>
                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <h5 class="text-muted">Estás a punto de comprar:</h5>
                        <h2 class="text-primary fw-bold" th:text="${inmueble.direccion}">Calle Falsa 123</h2>
                        <p class="lead" th:text="${inmueble.localidad}">Madrid</p>
                    </div>

                    <div class="alert alert-warning d-flex align-items-center" role="alert">
                        <i class="bi bi-info-circle-fill me-2 fs-4"></i>
                        <div>
                            Al confirmar, se generará el contrato de compraventa y el registro oficial en la plataforma.
                        </div>
                    </div>

                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item d-flex justify-content-between align-items-center bg-light">
                            <strong>Total a Pagar</strong>
                            <strong class="text-success fs-3" th:text="${inmueble.precio} + ' €'">150.000 €</strong>
                        </li>
                    </ul>

                    <form th:action="@{/transaccion/realizar}" method="post">
                        <input type="hidden" name="idInmueble" th:value="${inmueble.idInmueble}">

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold shadow">
                                ¡CONFIRMAR COMPRA!
                            </button>
                            <a th:href="@{/inmuebles/}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
