<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Mis Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Historial de Compras</h1>
        <a th:href="@{/perfil}" class="btn btn-secondary">Volver al Perfil</a>
    </div>

    <div th:if="${ventas.empty}" class="alert alert-info">
        No has realizado ninguna compra todavía.
    </div>

    <table class="table table-striped" th:unless="${ventas.empty}">
        <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Inmueble</th>
            <th>Precio</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${#dates.format(v.fechaVenta, 'dd/MM/yyyy')}">Fecha</td>
            <td>
                <span th:if="${v.inmueble != null}"
                      th:text="${v.inmueble.direccion + ' (' + v.inmueble.localidad + ')'}">Casa</span>
            </td>
            <td th:text="${v.precioVenta} + ' €'" class="fw-bold">Precio</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
