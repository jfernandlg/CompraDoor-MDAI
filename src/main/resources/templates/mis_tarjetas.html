<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Mis Tarjetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Mis Tarjetas</h1>
        <div>
            <a th:href="@{/perfil}" class="btn btn-secondary me-2">Volver al Perfil</a>
            <a th:href="@{/tarjetas/mis-tarjetas/new}" class="btn btn-success">
                <i class="bi bi-plus-lg"></i> Añadir Tarjeta
            </a>
        </div>
    </div>

    <div th:if="${tarjetas.empty}" class="alert alert-info">
        No tienes tarjetas guardadas.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:unless="${tarjetas.empty}">
        <div class="col" th:each="t : ${tarjetas}">
            <div class="card h-100 shadow-sm border-primary">
                <div class="card-body text-center">
                    <i class="bi bi-credit-card-2-front display-4 text-primary mb-3"></i>
                    <h5 class="card-title" th:text="${t.codigoTarjeta}">XXXX-XXXX</h5>
                    <p class="card-text">
                        Estado:
                        <span th:if="${t.valida}" class="badge bg-success">Activa</span>
                        <span th:unless="${t.valida}" class="badge bg-danger">Inactiva</span>
                    </p>
                </div>
                <div class="card-footer bg-white border-top-0 text-center">
                    <form th:action="@{/tarjetas/mis-tarjetas/{id}/delete(id=${t.id})}" method="post"
                          onsubmit="return confirm('¿Borrar tarjeta?');">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
